# NET_Mihomo · v0.2 · 2026-10-01
# 原生 Mihomo 双机场模板。仅填写两个订阅 URL，机场只提供节点。
# 不含真实机场名称、订阅凭据或私人兼容规则；填写后的副本请勿公开。
# 需要支持 PASS / empty-fallback 的 Mihomo。使用前阅读 README.md。

# 共用参数：YAML 锚点在加载时展开，不需要 JavaScript 覆写。
x-provider: &provider
  type: http
  interval: 86400
  proxy: DIRECT
  exclude-filter: '(?i)剩余流量|距离下次重置|套餐到期|导航页|官网|机场公告|到期时间|^\s*(到期|重置|获取|流量)\s*[:：]|traffic|expire|remaining|reset'
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204

x-auto: &auto
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  tolerance: 100
  lazy: true
  expected-status: 204
  empty-fallback: REJECT
  hidden: true

x-domain: &domain
  type: http
  behavior: domain
  format: yaml
  interval: 86400
  proxy: 资源下载

x-classical: &classical
  type: http
  behavior: classical
  format: yaml
  interval: 86400
  proxy: 资源下载

x-ip: &ip
  type: http
  behavior: ipcidr
  format: yaml
  interval: 86400
  proxy: 资源下载

# 地区依据节点名称判断；中转地与落地同时出现在名称中时需要人工调整。
x-hk: &hk '(?i)(香港|🇭🇰|(^|[^A-Za-z0-9])(Hong\s*Kong|Hong|HK)([^A-Za-z0-9]|$))'
x-tw: &tw '(?i)(台湾|台灣|🇹🇼|(^|[^A-Za-z0-9])(Taiwan|Taipei|Tai|TW)([^A-Za-z0-9]|$))'
x-jp: &jp '(?i)(日本|Japan|🇯🇵|(^|[^A-Za-z0-9])JP([^A-Za-z0-9]|$))'
x-sg: &sg '(?i)(新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^A-Za-z0-9])SG([^A-Za-z0-9]|$))'
x-us: &us '(?i)(美国|美國|United\s*States|States|🇺🇸|(^|[^A-Za-z0-9])(US|USA)([^A-Za-z0-9]|$))'
x-kr: &kr '(?i)(韩国|韓國|Korea|🇰🇷|(^|[^A-Za-z0-9])KR([^A-Za-z0-9]|$))'
x-known-regions: &known-regions '(?i)(香港|🇭🇰|(^|[^A-Za-z0-9])(Hong\s*Kong|Hong|HK)([^A-Za-z0-9]|$)|台湾|台灣|🇹🇼|(^|[^A-Za-z0-9])(Taiwan|Taipei|Tai|TW)([^A-Za-z0-9]|$)|日本|Japan|🇯🇵|(^|[^A-Za-z0-9])JP([^A-Za-z0-9]|$)|新加坡|狮城|獅城|Singapore|🇸🇬|(^|[^A-Za-z0-9])SG([^A-Za-z0-9]|$)|美国|美國|United\s*States|States|🇺🇸|(^|[^A-Za-z0-9])(US|USA)([^A-Za-z0-9]|$)|韩国|韓國|Korea|🇰🇷|(^|[^A-Za-z0-9])KR([^A-Za-z0-9]|$))'
x-service: &service
  type: select
  proxies: [节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]

# 1. 节点来源：接收 Clash/Mihomo 节点；不会引入机场的 DNS / rules / proxy-groups。
proxy-providers:
  AirportA:
    <<: *provider
    url: "https://example.com/REPLACE_AIRPORT_A_SUBSCRIPTION"
    path: ./providers/airport-a.yaml
    override:
      additional-prefix: '[A] '
  AirportB:
    <<: *provider
    url: "https://example.com/REPLACE_AIRPORT_B_SUBSCRIPTION"
    path: ./providers/airport-b.yaml
    override:
      additional-prefix: '[B] '

# 2. 本机网络：FlClash 的界面设置可能覆盖这些字段。
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: ''
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true

# 默认不主动接管系统路由；在客户端按需开启 TUN。
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack: [any:53, 'tcp://any:53']

# 3. DNS：节点解析与直连解析独立，普通解析明确通过代理。
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # '*' 在域名通配语法中匹配单段主机名，不是匹配所有域名。
    - '*'
    - 'rule-set:Private'
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.localdomain'
    - '+.internal'
    - localhost
    - '+.pool.ntp.org'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  direct-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  direct-nameserver-follow-policy: true
  nameserver:
    - 'https://1.1.1.1/dns-query#节点选择'
    - 'https://8.8.8.8/dns-query#节点选择'
  nameserver-policy:
    # 国内上传域名使用国内 DNS。
    'rule-set:UploadCN':
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'
    # 内网 DNS 依赖当前网络；若系统 DNS 指向本核心，请改填真实内网 DNS，避免回环。
    'rule-set:Private': system
    '*': system
    '+.lan': system
    '+.local': system
    '+.home.arpa': system
    '+.localdomain': system
    '+.internal': system
    'rule-set:China':
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'

# 只补充域名识别，默认不把目的地址改写成嗅探结果。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  sniff:
    HTTP: {ports: [80, '8080-8880'], override-destination: false}
    TLS: {ports: [443, 8443], override-destination: false}
    QUIC: {ports: [443, 8443], override-destination: false}
  skip-domain: ['+.push.apple.com']

# 4. 策略组：服务 -> 地区 -> AB / A / B；服务也可直接指定机场或节点。
proxy-groups:
  # 通用流量默认由“节点选择”决定。
  - name: 节点选择
    type: select
    proxies: [DIRECT, 香港, 美国, 日本, 韩国, 台湾, 新加坡, 其他地区, 机场 A, 机场 B, 全部节点]
  # 仅供 rule-provider 等内部资源下载，不参加普通业务流量。
  - name: 资源下载
    type: fallback
    use: [AirportA, AirportB]
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT
    hidden: true
  - name: AI
    type: select
    default-selected: 节点选择
    proxies: [DIRECT, 节点选择, 香港, 美国, 日本, 韩国, 台湾, 新加坡, 其他地区, 机场 A, 机场 B, 全部节点]
  - {name: Google, <<: *service}
  - name: Microsoft
    <<: *service
    proxies: [节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]
  - name: Apple
    <<: *service
    proxies: [DIRECT, 节点选择, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]
  - {name: Twitter, <<: *service}
  - {name: Telegram, <<: *service}
  # 广告默认拦截；PASS 可关闭拦截并继续匹配规则。
  - {name: 广告过滤, type: select, default-selected: REJECT, proxies: [PASS, REJECT]}
  - {name: 机场 A, type: select, use: [AirportA], empty-fallback: REJECT}
  - {name: 机场 B, type: select, use: [AirportB], empty-fallback: REJECT}
  - {name: 全部节点, type: select, use: [AirportA, AirportB], empty-fallback: REJECT}

  - {name: 香港, type: select, proxies: [香港 · AB（自动）, 香港 · 机场 A（自动）, 香港 · 机场 B（自动）]}
  - {name: 台湾, type: select, proxies: [台湾 · AB（自动）, 台湾 · 机场 A（自动）, 台湾 · 机场 B（自动）]}
  - {name: 日本, type: select, proxies: [日本 · AB（自动）, 日本 · 机场 A（自动）, 日本 · 机场 B（自动）]}
  - {name: 新加坡, type: select, proxies: [新加坡 · AB（自动）, 新加坡 · 机场 A（自动）, 新加坡 · 机场 B（自动）]}
  - {name: 美国, type: select, proxies: [美国 · AB（自动）, 美国 · 机场 A（自动）, 美国 · 机场 B（自动）]}
  - {name: 韩国, type: select, proxies: [韩国 · AB（自动）, 韩国 · 机场 A（自动）, 韩国 · 机场 B（自动）]}
  - {name: 其他地区, type: select, proxies: [其他地区 · AB（自动）, 其他地区 · 机场 A（自动）, 其他地区 · 机场 B（自动）]}

  - {name: 香港 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *hk}
  - {name: 香港 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *hk}
  - {name: 香港 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *hk}
  - {name: 台湾 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *tw}
  - {name: 台湾 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *tw}
  - {name: 台湾 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *tw}
  - {name: 日本 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *jp}
  - {name: 日本 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *jp}
  - {name: 日本 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *jp}
  - {name: 新加坡 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *sg}
  - {name: 新加坡 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *sg}
  - {name: 新加坡 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *sg}
  - {name: 美国 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *us}
  - {name: 美国 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *us}
  - {name: 美国 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *us}
  - {name: 韩国 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *kr}
  - {name: 韩国 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *kr}
  - {name: 韩国 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *kr}
  - {name: 其他地区 · AB（自动）, <<: *auto, use: [AirportA, AirportB], exclude-filter: *known-regions}
  - {name: 其他地区 · 机场 A（自动）, <<: *auto, use: [AirportA], exclude-filter: *known-regions}
  - {name: 其他地区 · 机场 B（自动）, <<: *auto, use: [AirportB], exclude-filter: *known-regions}

# 5. 规则来源：主规则由我们维护，机场订阅无权替换。
rule-providers:
  UploadCN:
    type: http
    behavior: classical
    format: text
    interval: 86400
    proxy: 资源下载
    path: ./rules/upload-cn.list
    url: https://raw.githubusercontent.com/NET86/NET/main/List/UploadCN.list
  Private:
    <<: *classical
    path: ./rules/private.yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml
  AI-Daily:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: 资源下载
    path: ./rules/ai-daily.yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/ai-daily.yaml
  Microsoft-Copilot:
    <<: *classical
    path: ./rules/microsoft-copilot.yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/microsoft-copilot.yaml
  GitHub-Copilot:
