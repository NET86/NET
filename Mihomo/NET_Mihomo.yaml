# NET_Mihomo · v0.2 · 2026-09-25
# 原生 Mihomo 双机场模板。仅填写两个订阅 URL，机场只提供节点。
# 不含真实机场名称、订阅凭据或私人兼容规则；填写后的副本请勿公开。
# 需要支持 MRS / PASS / empty-fallback 的 Mihomo。使用前阅读 README.md。

# 共用参数：YAML 锚点在加载时展开，不需要 JavaScript 覆写。
x-provider: &provider
  type: http
  interval: 86400
  proxy: DIRECT
  exclude-filter: '(?i)剩余流量|距离下次重置|套餐到期|导航页|官网|机场公告|到期时间|^\s*(到期|重置|获取|流量)\s*[:：]|traffic|expire|remaining|reset'
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204

x-auto: &auto
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  timeout: 5000
  tolerance: 100
  lazy: true
  expected-status: 204
  empty-fallback: REJECT
  hidden: true

x-domain: &domain
  type: http
  behavior: domain
  format: mrs
  interval: 86400
  proxy: 自动回退

x-ip: &ip
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400
  proxy: 自动回退

# 地区依据节点名称判断；中转地与落地同时出现在名称中时需要人工调整。
x-hk: &hk '(?i)(香港|Hong\s*Kong|🇭🇰|\bHK\b)'
x-tw: &tw '(?i)(台湾|台灣|Taiwan|🇹🇼|\bTW\b)'
x-jp: &jp '(?i)(日本|Japan|🇯🇵|\bJP\b)'
x-sg: &sg '(?i)(新加坡|狮城|獅城|Singapore|🇸🇬|\bSG\b)'
x-us: &us '(?i)(美国|美國|United\s*States|USA|🇺🇸|\bUS\b)'
x-kr: &kr '(?i)(韩国|韓國|Korea|🇰🇷|\bKR\b)'
x-known-regions: &known-regions '(?i)(香港|Hong\s*Kong|🇭🇰|\bHK\b|台湾|台灣|Taiwan|🇹🇼|\bTW\b|日本|Japan|🇯🇵|\bJP\b|新加坡|狮城|獅城|Singapore|🇸🇬|\bSG\b|美国|美國|United\s*States|USA|🇺🇸|\bUS\b|韩国|韓國|Korea|🇰🇷|\bKR\b)'
x-service: &service
  type: select
  proxies: [节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]

# 1. 节点来源：接收 Clash/Mihomo 节点；不会引入机场的 DNS / rules / proxy-groups。
proxy-providers:
  AirportA:
    <<: *provider
    url: "https://example.com/REPLACE_AIRPORT_A_SUBSCRIPTION"
    path: ./providers/airport-a.yaml
    override:
      additional-prefix: '[A] '
  AirportB:
    <<: *provider
    url: "https://example.com/REPLACE_AIRPORT_B_SUBSCRIPTION"
    path: ./providers/airport-b.yaml
    override:
      additional-prefix: '[B] '

# 2. 本机网络：FlClash 的界面设置可能覆盖这些字段。
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: ''
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
profile:
  store-selected: true
  store-fake-ip: true

# 默认不主动接管系统路由；在客户端按需开启 TUN。
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack: [any:53, 'tcp://any:53']

# 3. DNS：节点解析与直连解析独立，普通解析明确通过代理。
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    # '*' 在域名通配语法中匹配单段主机名，不是匹配所有域名。
    - '*'
    - 'rule-set:Private'
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.localdomain'
    - '+.internal'
    - localhost
    - '+.pool.ntp.org'
    - 'time.*.com'
    - 'ntp.*.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'stun.*.*'
    - 'stun.*.*.*'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
  default-nameserver: [223.5.5.5, 119.29.29.29]
  proxy-server-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  direct-nameserver:
    - 'https://dns.alidns.com/dns-query#DIRECT'
    - 'https://doh.pub/dns-query#DIRECT'
  direct-nameserver-follow-policy: true
  nameserver:
    - 'https://1.1.1.1/dns-query#节点选择'
    - 'https://8.8.8.8/dns-query#节点选择'
  nameserver-policy:
    # 内网 DNS 依赖当前网络；若系统 DNS 指向本核心，请改填真实内网 DNS，避免回环。
    'rule-set:Private': system
    '*': system
    '+.lan': system
    '+.local': system
    '+.home.arpa': system
    '+.localdomain': system
    '+.internal': system
    'rule-set:China':
      - 'https://dns.alidns.com/dns-query#DIRECT'
      - 'https://doh.pub/dns-query#DIRECT'

# 只补充域名识别，默认不把目的地址改写成嗅探结果。
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: false
  sniff:
    HTTP: {ports: [80, '8080-8880'], override-destination: false}
    TLS: {ports: [443, 8443], override-destination: false}
    QUIC: {ports: [443, 8443], override-destination: false}
  skip-domain: ['+.push.apple.com']

# 4. 策略组：服务 -> 地区 -> AB / A / B；服务也可直接指定机场或节点。
proxy-groups:
  # 通用流量默认故障回退；固定出口请手选地区/节点。AI 默认不使用此组。
  - name: 节点选择
    type: select
    proxies: [自动回退, 全部节点, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, DIRECT]
  # 按 provider 顺序选第一个健康节点，可能跨地区；不回退 DIRECT。
  # 规则下载也使用本组，不随用户把“节点选择”切到空地区而失效。
  - name: 自动回退
    type: fallback
    use: [AirportA, AirportB]
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: false
    expected-status: 204
    empty-fallback: REJECT
  - name: AI
    type: select
    proxies: [AI 专用节点, 日本, 美国, 新加坡, 台湾, 韩国, 节点选择, 香港, 其他地区, 机场 A, 机场 B, 全部节点, DIRECT]
  # 独立手选，不随“全部节点”的选择改变；地区筛选不代表实际服务可用。
  - name: AI 专用节点
    type: select
    use: [AirportA, AirportB]
    filter: '(?i)(日本|Japan|🇯🇵|\bJP\b|美国|美國|United\s*States|USA|🇺🇸|\bUS\b|新加坡|Singapore|🇸🇬|\bSG\b|台湾|台灣|Taiwan|🇹🇼|\bTW\b|韩国|韓國|Korea|🇰🇷|\bKR\b)'
    empty-fallback: REJECT
  - {name: Google, <<: *service}
  # 默认与 Surge 一致跟随微软；需要时仍可为 GitHub 独立选出口。
  - name: GitHub
    <<: *service
    proxies: [Microsoft, 节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]
  - name: Microsoft
    <<: *service
    proxies: [节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]
  - name: Apple
    <<: *service
    proxies: [DIRECT, 节点选择, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]
  - {name: Twitter, <<: *service}
  - {name: Telegram, <<: *service}
  - name: Final
    <<: *service
    proxies: [节点选择, DIRECT, 香港, 台湾, 日本, 新加坡, 美国, 韩国, 其他地区, 机场 A, 机场 B, 全部节点]
  # PASS 表示继续匹配规则，并非直接出站；默认不拦截广告。
  - {name: 广告过滤, type: select, proxies: [PASS, REJECT]}
  - {name: 机场 A, type: select, use: [AirportA], empty-fallback: REJECT}
  - {name: 机场 B, type: select, use: [AirportB], empty-fallback: REJECT}
  - {name: 全部节点, type: select, use: [AirportA, AirportB], empty-fallback: REJECT}

  - {name: 香港, type: select, proxies: [香港 · AB（自动）, 香港 · 机场 A（自动）, 香港 · 机场 B（自动）]}
  - {name: 台湾, type: select, proxies: [台湾 · AB（自动）, 台湾 · 机场 A（自动）, 台湾 · 机场 B（自动）]}
  - {name: 日本, type: select, proxies: [日本 · AB（自动）, 日本 · 机场 A（自动）, 日本 · 机场 B（自动）]}
  - {name: 新加坡, type: select, proxies: [新加坡 · AB（自动）, 新加坡 · 机场 A（自动）, 新加坡 · 机场 B（自动）]}
  - {name: 美国, type: select, proxies: [美国 · AB（自动）, 美国 · 机场 A（自动）, 美国 · 机场 B（自动）]}
  - {name: 韩国, type: select, proxies: [韩国 · AB（自动）, 韩国 · 机场 A（自动）, 韩国 · 机场 B（自动）]}
  - {name: 其他地区, type: select, proxies: [其他地区 · AB（自动）, 其他地区 · 机场 A（自动）, 其他地区 · 机场 B（自动）]}

  - {name: 香港 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *hk}
  - {name: 香港 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *hk}
  - {name: 香港 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *hk}
  - {name: 台湾 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *tw}
  - {name: 台湾 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *tw}
  - {name: 台湾 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *tw}
  - {name: 日本 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *jp}
  - {name: 日本 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *jp}
  - {name: 日本 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *jp}
  - {name: 新加坡 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *sg}
  - {name: 新加坡 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *sg}
  - {name: 新加坡 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *sg}
  - {name: 美国 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *us}
  - {name: 美国 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *us}
  - {name: 美国 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *us}
  - {name: 韩国 · AB（自动）, <<: *auto, use: [AirportA, AirportB], filter: *kr}
  - {name: 韩国 · 机场 A（自动）, <<: *auto, use: [AirportA], filter: *kr}
  - {name: 韩国 · 机场 B（自动）, <<: *auto, use: [AirportB], filter: *kr}
  - {name: 其他地区 · AB（自动）, <<: *auto, use: [AirportA, AirportB], exclude-filter: *known-regions}
  - {name: 其他地区 · 机场 A（自动）, <<: *auto, use: [AirportA], exclude-filter: *known-regions}
  - {name: 其他地区 · 机场 B（自动）, <<: *auto, use: [AirportB], exclude-filter: *known-regions}

# 5. 规则来源：主规则由我们维护，机场订阅无权替换。
rule-providers:
  AI-Daily:
    type: http
    behavior: classical
    format: yaml
    interval: 86400
    proxy: 自动回退
    path: ./rules/ai-daily.yaml
    url: https://raw.githubusercontent.com/NET86/rules/stable/rules/mihomo/ai-daily.yaml
  # ai-daily 当前不包含 Copilot；补充 GitHub 集合和下方 Microsoft 精确域名。
  AI-Copilot:
    <<: *domain
    path: ./rules/github-copilot.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github-copilot.mrs
  Private:
    <<: *domain
    path: ./rules/private.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs
  Ads:
    <<: *domain
    path: ./rules/ads.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs
  Apple:
    <<: *domain
    path: ./rules/apple.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs
  Google:
    <<: *domain
    path: ./rules/google.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs
  YouTube:
    <<: *domain
    path: ./rules/youtube.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs
  GitHub:
    <<: *domain
    path: ./rules/github.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs
  Microsoft:
    <<: *domain
    path: ./rules/microsoft.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs
  Twitter:
    <<: *domain
    path: ./rules/twitter.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/twitter.mrs
  Telegram:
    <<: *domain
    path: ./rules/telegram.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs
  Telegram-IP:
    <<: *ip
    path: ./rules/telegram-ip.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs
  SteamCN:
    <<: *domain
    path: ./rules/steam-cn.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.mrs
  BiliIntl:
    <<: *domain
    path: ./rules/biliintl.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/biliintl.mrs
  Global:
    <<: *domain
    path: ./rules/global.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/geolocation-!cn.mrs
  China:
    <<: *domain
    path: ./rules/china.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs
  China-IP:
    <<: *ip
    path: ./rules/china-ip.mrs
    url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs

# 6. 从上至下首次命中。具体服务在通用海外/国内集合之前。
rules:
  # 私人例外可加在这里；先核查影响范围，不要写共享 CDN 的整站归类。
  - DOMAIN-REGEX,^[^.]+$,DIRECT
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - DOMAIN-SUFFIX,home.arpa,DIRECT
  - DOMAIN-SUFFIX,localdomain,DIRECT
  - DOMAIN-SUFFIX,internal,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,ff00::/8,DIRECT,no-resolve
  - RULE-SET,Private,DIRECT
  - RULE-SET,AI-Daily,AI
  - RULE-SET,AI-Copilot,AI
  - DOMAIN-SUFFIX,copilot.microsoft.com,AI
  - DOMAIN-SUFFIX,copilot.cloud.microsoft,AI
  - DOMAIN-SUFFIX,copilot.com,AI
  - DOMAIN-SUFFIX,copilot-stg.com,AI
  - RULE-SET,Ads,广告过滤
  # 限定的 Windows 更新/网络检测直连，避免所有 Microsoft 流量被强制直连。
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,DIRECT
  - DOMAIN-SUFFIX,update.microsoft.com,DIRECT
  - DOMAIN-SUFFIX,windowsupdate.com,DIRECT
  - DOMAIN-SUFFIX,windowsupdate.microsoft.com,DIRECT
  - DOMAIN,www.msftconnecttest.com,DIRECT
  - DOMAIN,dns.msftncsi.com,DIRECT
  - DOMAIN-SUFFIX,appstore.com,Apple
  - RULE-SET,Apple,Apple
  - RULE-SET,YouTube,Google
  - RULE-SET,Google,Google
  - RULE-SET,GitHub,GitHub
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Twitter,Twitter
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Telegram-IP,Telegram,no-resolve
  - RULE-SET,SteamCN,DIRECT
  - RULE-SET,BiliIntl,节点选择
  - RULE-SET,Global,节点选择
  - RULE-SET,China,DIRECT
  - RULE-SET,China-IP,DIRECT
  - MATCH,Final
