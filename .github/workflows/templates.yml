name: Validate public templates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CI-only parser and official Mihomo
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mihomo.gz" \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  $RUNNER_TEMP/mihomo.gz" | sha256sum --check
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          chmod +x "$RUNNER_TEMP/mihomo"
      - name: Check real templates and synthetic provider scenarios
        run: python .github/check_templates.py "$RUNNER_TEMP/mihomo"
